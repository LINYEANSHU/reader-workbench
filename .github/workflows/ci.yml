name: Reader Workbench Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    name: Windows build, tests and security audit
    runs-on: windows-latest
    env:
      READER_TEST_SPEECH_ASSETS: ${{ github.workspace }}/.reader-runtime/sensevoice-small-int8
      READER_SPEECH_ASSET_DIR: ${{ github.workspace }}/.reader-runtime/sensevoice-small-int8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Chinese font on Windows
        shell: pwsh
        run: ./.github/scripts/install-noto-windows.ps1
      - name: Office on Windows
        shell: pwsh
        run: |
          $readerInstaller = Join-Path $env:RUNNER_TEMP 'reader-libreoffice.msi'
          Invoke-WebRequest 'https://download.documentfoundation.org/libreoffice/stable/26.2.6/win/x86_64/LibreOffice_26.2.6_Win_x86-64.msi' -OutFile $readerInstaller
          if ((Get-FileHash -LiteralPath $readerInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660') { throw 'Converter hash mismatch' }
          $readerInstall = Start-Process msiexec.exe -ArgumentList @('/i', $readerInstaller, '/qn', '/norestart') -WindowStyle Hidden -Wait -PassThru
          if ($readerInstall.ExitCode -notin @(0, 3010)) { throw 'Converter installation failed' }
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org
      - run: node scripts/fixture-manifest.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium chrome
      - name: Native capture stability on Windows
        run: npx playwright test tests/e2e/capture.spec.ts --grep "actual getDisplayMedia" --repeat-each=10 --output=test-results/native-capture-repeat
      - run: node scripts/prepare-speech.mjs --cache .reader-runtime/sensevoice-small-int8
      - run: npm test
      - name: Browser tests on Windows
        run: npm run test:e2e
      - name: Save failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-windows
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            test-results/
            .superpowers/sdd/2026-10-11-reader-workbench/native-source-window.png
            .superpowers/sdd/2026-10-11-reader-workbench/native-raw-frame.png
            .superpowers/sdd/2026-10-11-reader-workbench/native-capture-geometry.json
