<text x="334" y="397" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#3e50b4" text-anchor="start">组织上下文</text>
<text x="910" y="397" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#076f64" text-anchor="start">校验后执行</text>
<g id="reading-context">
<rect x="48" y="418" width="528" height="230" rx="12" fill="#fffdf9" stroke="#bbc4ca" stroke-width="1.5"/>
<text x="76" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="32" font-weight="600" fill="#243340" text-anchor="start">阅读上下文</text>
<text x="76" y="502" font-family="'Cascadia Code', Consolas, monospace" font-size="20" font-weight="400" fill="#3e50b4" text-anchor="start">ContextBuilder</text>
<text x="76" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="400" fill="#243340" text-anchor="start">原文与页记忆 · 按文档版本缓存</text>
<text x="76" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="400" fill="#243340" text-anchor="start">已提交历史 · 按预算生成摘要</text>
<text x="76" y="616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="400" fill="#243340" text-anchor="start">Cognee / Python · 可选关联检索</text>
</g>
<g id="tool-execution">
<rect x="624" y="418" width="528" height="230" rx="12" fill="#fffdf9" stroke="#bbc4ca" stroke-width="1.5"/>
<text x="652" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="32" font-weight="600" fill="#243340" text-anchor="start">工具与扩展</text>
<text x="652" y="502" font-family="'Cascadia Code', Consolas, monospace" font-size="20" font-weight="400" fill="#076f64" text-anchor="start">ToolExecutor · ToolRegistry</text>
<text x="652" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="400" fill="#243340" text-anchor="start">文档读取 · 页码与来源范围校验</text>
<text x="652" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="400" fill="#243340" text-anchor="start">阅读件生成 · 仅在写入获准时</text>
<text x="652" y="616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="400" fill="#243340" text-anchor="start">插件 / 外部 MCP · 启用且受信任</text>
</g>
<path d="M 312 648 V 710" fill="none" stroke="#3e50b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<path d="M 888 648 V 710" fill="none" stroke="#076f64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<text x="600" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="middle">按工作区保存</text>
<g id="workspace-storage">
<rect x="48" y="714" width="1104" height="110" rx="12" fill="#e6ebe8"/>
<text x="76" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#243340" text-anchor="start">本地状态与记忆</text>
<text x="76" y="793" font-family="'Cascadia Code', Consolas, monospace" font-size="22" font-weight="400" fill="#586474" text-anchor="start">.reader-workbench/ · SQLite · cache</text>
<path d="M 626 738 V 800" fill="none" stroke="#586474" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="660" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#243340" text-anchor="start">生成的阅读件</text>
<text x="660" y="793" font-family="'Cascadia Code', Consolas, monospace" font-size="22" font-weight="400" fill="#586474" text-anchor="start">outputs/&lt;session&gt;/</text>
