<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">From a question to reading history</title>
<desc id="desc">Queue per session, assemble source-aware context and pin history revisions, call the model, validate tools and feed results back, then commit the complete turn only to the current session on success. Failure or cancellation does not commit an unfinished turn.</desc>
<defs><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#586474" stroke-width="1.7"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#3e50b4" stroke-width="1.7"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#076f64" stroke-width="1.7"/></marker></defs>
<rect x="0" y="0" width="1200" height="1000" rx="16" fill="#f5f3ed"/>
<text x="48" y="55" font-family="'Cascadia Code', Consolas, monospace" font-size="20" font-weight="400" fill="#586474" text-anchor="start">READER WORKBENCH  /  02</text>
<text x="48" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="48" font-weight="650" fill="#243340" text-anchor="start">From a question to reading history</text>
<text x="48" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" fill="#586474" text-anchor="start">Prepare sources and permissions. Feed tool results back into the same run.</text>
<g id="question-to-history">
<rect x="48" y="228" width="656" height="132" rx="12" fill="#fffdf9" stroke="#bbc4ca" stroke-width="1.5"/>
<text x="72" y="270" font-family="'Cascadia Code', Consolas, monospace" font-size="24" font-weight="600" fill="#3e50b4" text-anchor="start">01</text>
<text x="130" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="600" fill="#243340" text-anchor="start">Accept and queue</text>
<text x="130" y="307" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Main session / temporary branch</text>
<text x="130" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Deduplicate · run each session in order</text>
<path d="M 376 360 V 392" fill="none" stroke="#3e50b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<rect x="48" y="400" width="656" height="132" rx="12" fill="#fffdf9" stroke="#bbc4ca" stroke-width="1.5"/>
<text x="72" y="442" font-family="'Cascadia Code', Consolas, monospace" font-size="24" font-weight="600" fill="#3e50b4" text-anchor="start">02</text>
<text x="130" y="443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="600" fill="#243340" text-anchor="start">Build reading context</text>
<text x="130" y="479" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Committed history + sources + page memory</text>
<text x="130" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Budget summaries · pin history revisions</text>
<path d="M 376 532 V 564" fill="none" stroke="#3e50b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<rect x="48" y="572" width="656" height="132" rx="12" fill="#243340"/>
<text x="72" y="614" font-family="'Cascadia Code', Consolas, monospace" font-size="24" font-weight="600" fill="#c8d6df" text-anchor="start">03</text>
<text x="130" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="600" fill="#fffdf9" text-anchor="start">Stream the model response</text>
<text x="130" y="651" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#c8d6df" text-anchor="start">Context + available tools → model</text>
<text x="130" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#c8d6df" text-anchor="start">Continue when complete, with no tool calls</text>
<path d="M 376 704 V 736" fill="none" stroke="#3e50b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
<rect x="48" y="744" width="656" height="132" rx="12" fill="#fffdf9" stroke="#bbc4ca" stroke-width="1.5"/>
<text x="72" y="786" font-family="'Cascadia Code', Consolas, monospace" font-size="24" font-weight="600" fill="#3e50b4" text-anchor="start">04</text>
<text x="130" y="787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="600" fill="#243340" text-anchor="start">Commit the complete turn</text>
<text x="130" y="823" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Current session only · increment revision</text>
<text x="130" y="854" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Completion event → refresh UI → keep reading</text>
</g>
<g id="session-boundary">
<text x="816" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="27" font-weight="600" fill="#243340" text-anchor="start">Independent follow-ups</text>
<path d="M 816 284 H 1152" fill="none" stroke="#586474" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="816" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Read completed main history</text>
<text x="816" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Keep a separate question chain</text>
<text x="816" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#586474" text-anchor="start">Never write answers to main chat</text>
</g>
<g id="tool-loop">
<rect x="816" y="535" width="336" height="210" rx="12" fill="#e6ebe8"/>
<text x="840" y="581" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="600" fill="#076f64" text-anchor="start">Tools, when needed</text>
<text x="840" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="400" fill="#243340" text-anchor="start">Validate scope + arguments</text>
<text x="840" y="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="400" fill="#243340" text-anchor="start">Execute and record results</text>
<text x="840" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="400" fill="#243340" text-anchor="start">Source / artifact events</text>
<text x="840" y="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="400" fill="#243340" text-anchor="start">Feed back · up to 8 rounds</text>
<path d="M 704 600 H 808" fill="none" stroke="#076f64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<path d="M 816 680 H 712" fill="none" stroke="#076f64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<text x="760" y="581" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20" font-weight="400" fill="#076f64" text-anchor="middle">Call</text>
<text x="760" y="713" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20" font-weight="400" fill="#076f64" text-anchor="middle">Result</text>
</g>
<g id="failure-boundary">
<path d="M 48 917 H 1152" fill="none" stroke="#586474" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="956" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" fill="#586474" text-anchor="start">Failure or cancellation: retain run records; do not commit an unfinished turn.</text>
</g>
</svg>
